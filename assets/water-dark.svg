<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120" viewBox="0 0 800 120" shape-rendering="crispEdges">
  <!-- dithered water, dark ground. three bayer-ish dot densities, three swell
       trains at different speeds. wave period is 400px so a 400px translate
       loops without a seam. -->
  <defs>
    <pattern id="d1" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#7fe0c4"/></pattern>
    <pattern id="d2" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#7fe0c4" opacity=".55"/></pattern>
    <pattern id="d3" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#7fe0c4" opacity=".28"/></pattern>
  </defs>
  <rect width="800" height="120" fill="#04100e"/>
  <path fill="url(#d3)" d="M-800,42 Q-700,22 -600,42 T-400,42 T-200,42 T0,42 T200,42 T400,42 T600,42 T800,42 T1000,42 T1200,42 V120 H-800 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="400 0" dur="22s" repeatCount="indefinite"/>
  </path>
  <path fill="url(#d2)" d="M-800,68 Q-700,52 -600,68 T-400,68 T-200,68 T0,68 T200,68 T400,68 T600,68 T800,68 T1000,68 T1200,68 V120 H-800 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-400 0" dur="15s" repeatCount="indefinite"/>
  </path>
  <path fill="url(#d1)" d="M-800,92 Q-700,80 -600,92 T-400,92 T-200,92 T0,92 T200,92 T400,92 T600,92 T800,92 T1000,92 T1200,92 V120 H-800 Z">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="400 0" dur="9s" repeatCount="indefinite"/>
  </path>
  <!-- the fish, drifting the other way, deeper than the crests -->
  <g fill="#7fe0c4" opacity=".7">
    <rect x="0" y="0" width="2" height="2"/><rect x="2" y="2" width="2" height="2"/><rect x="4" y="2" width="6" height="2"/>
    <rect x="10" y="0" width="2" height="2"/><rect x="2" y="4" width="2" height="2"/><rect x="4" y="4" width="6" height="2"/>
    <rect x="10" y="4" width="2" height="2"/><rect x="0" y="4" width="2" height="2"/><rect x="12" y="2" width="2" height="2"/>
    <animateTransform attributeName="transform" type="translate" from="820 104" to="-30 100" dur="38s" repeatCount="indefinite"/>
  </g>
</svg>
